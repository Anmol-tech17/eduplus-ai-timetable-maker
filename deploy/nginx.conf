# EduPlus AI Timetable Maker — Nginx Frontend & Reverse Proxy Configuration
# For production HTTPS, terminate TLS here (Let's Encrypt / institutional cert)
# and redirect HTTP port 80 -> HTTPS port 443.

upstream eduplus_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Enable HSTS once HTTPS is active:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static frontend assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to FastAPI backend
    location /api/ {
        proxy_pass http://eduplus_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Allow synchronous CP-SAT requests up to 120s (prefer /generate/async for large scopes)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
