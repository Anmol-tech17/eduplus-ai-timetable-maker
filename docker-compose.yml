# EduPlus AI Timetable Maker — Production-Style Docker Compose Stack
# Usage:
#   1. Copy .env.production.example to .env and replace all placeholder secrets.
#   2. docker compose up -d --build
#   3. docker compose exec api python -m alembic -c backend/alembic.ini upgrade head

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduplus_prod}
      POSTGRES_USER: ${POSTGRES_USER:-eduplus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - eduplus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduplus_user} -d ${POSTGRES_DB:-eduplus_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduplus_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-eduplus_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eduplus_prod}
      HOST: 0.0.0.0
      PORT: 8000
    expose:
      - "8000"
    networks:
      - eduplus_net

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
      # Uncomment for TLS termination once certificates are mounted:
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./admin.html:/usr/share/nginx/html/admin.html:ro
      - ./teacher.html:/usr/share/nginx/html/teacher.html:ro
      - ./student.html:/usr/share/nginx/html/student.html:ro
      - ./src:/usr/share/nginx/html/src:ro
    networks:
      - eduplus_net

volumes:
  eduplus_pgdata:

networks:
  eduplus_net:
    driver: bridge
